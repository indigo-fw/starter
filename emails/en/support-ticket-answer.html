<!-- subject: New reply on your ticket: {{subject}} -->
<!-- preheader: Our support team has answered your ticket -->
<h2 style="margin:0 0 16px; font-size:22px; color:#111827">Our team has replied</h2>
<p style="margin:0 0 16px; color:#4b5563; line-height:1.6">
  Hi {{name|there}}, there is a new reply on your ticket <strong>{{subject}}</strong>:
</p>
<blockquote style="margin:0 0 24px; padding:12px 16px; border-left:3px solid {{brandColor}}; background:#f9fafb; color:#374151; line-height:1.6">
  {{preview}}
</blockquote>
<a href="{{{ticketUrl}}}" style="display:inline-block; background:{{brandColor}}; color:white; padding:12px 24px; border-radius:6px; text-decoration:none; font-weight:500">
  View ticket
</a>
<p style="margin:24px 0 0; color:#9ca3af; font-size:14px; line-height:1.6">
  Reply from the ticket page so our team sees your answer in the right conversation.
</p>
