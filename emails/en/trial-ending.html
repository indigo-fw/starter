<!-- subject: Your trial ends in {{daysLeft}} day{{daysPlural}} -->
<!-- preheader: Pick a plan to keep your premium features -->
<h2 style="margin:0 0 16px; font-size:22px; color:#111827">Hi {{firstName}},</h2>
<p style="margin:0 0 16px; color:#4b5563; line-height:1.6">
  Your trial of <strong>{{planName}}</strong> ends in <strong>{{daysLeft}} day{{daysPlural}}</strong>.
  After that your account drops to the Free tier — you keep your data, but the premium features turn off.
</p>
<p style="margin:0 0 20px; color:#4b5563; line-height:1.6">Pick a plan to keep them:</p>
<a href="{{{pricingUrl}}}" style="display:inline-block; background:{{brandColor}}; color:white; padding:12px 24px; border-radius:6px; text-decoration:none; font-weight:500">
  See plans
</a>
<p style="margin:24px 0 0; color:#9ca3af; font-size:13px; line-height:1.6">
  Or just keep using the Free tier — we&rsquo;ll be here when you&rsquo;re ready.
</p>
