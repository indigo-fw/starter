services:
  app:
    image: ghcr.io/indigo-fw/starter:latest
    # env_file loads ALL vars from .env — environment: overrides take precedence
    env_file: .env
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Override env_file values that need Docker-internal hostnames
      - DATABASE_URL=postgresql://indigo:${POSTGRES_PASSWORD}@postgres:5432/indigo
      - REDIS_URL=redis://redis:6379
      - SERVER_ROLE=all
      - NODE_ENV=production
      # Hardcoded for demo VPS — Better Auth origin check requires correct runtime value
      - NEXT_PUBLIC_APP_URL=https://demo.indigo-fw.dev
      - BETTER_AUTH_URL=https://demo.indigo-fw.dev
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Uncomment to run background workers separately ───────────────────────
  # worker:
  #   image: ghcr.io/indigo-fw/starter:latest
  #   env_file: .env
  #   environment:
  #     - DATABASE_URL=postgresql://indigo:${POSTGRES_PASSWORD}@postgres:5432/indigo
  #     - REDIS_URL=redis://redis:6379
  #     - SERVER_ROLE=worker
  #     - NODE_ENV=production
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=indigo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=indigo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indigo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads:
