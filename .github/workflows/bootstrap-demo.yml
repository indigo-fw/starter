name: bootstrap-demo

on:
  workflow_dispatch:

# One-shot workflow: seeds the demo DB, installs the hourly reset cron, and
# updates /opt/indigo/.env with INDIGO_ROBOTS_PROFILE=demo.
# Run once manually from the Actions tab. Safe to re-run.

jobs:
  bootstrap:
    name: Bootstrap demo VPS
    runs-on: ubuntu-latest
    steps:
      - name: Pre-flight + seed + cron install
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEMO_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/indigo

            echo "=== 1. Container status ==="
            docker compose -f docker-compose.prod.yml ps

            echo "=== 2. Check INIT_ADMIN vars ==="
            if ! grep -qE '^INIT_ADMIN_EMAIL=' .env; then
              echo "INIT_ADMIN_EMAIL=demo@indigo-fw.dev" >> .env
              echo "INIT_ADMIN_PASSWORD=demo1234" >> .env
              echo "INIT_ADMIN_NAME=Demo Admin" >> .env
              echo "Added INIT_ADMIN vars"
            else
              echo "INIT_ADMIN vars already present"
            fi

            echo "=== 3. Set INDIGO_ROBOTS_PROFILE=demo ==="
            if grep -q '^INDIGO_ROBOTS_PROFILE=' .env; then
              sed -i 's/^INDIGO_ROBOTS_PROFILE=.*/INDIGO_ROBOTS_PROFILE=demo/' .env
            else
              echo "INDIGO_ROBOTS_PROFILE=demo" >> .env
            fi
            echo "INDIGO_ROBOTS_PROFILE set to demo"

            echo "=== 3.5. Set BETTER_AUTH_URL + NEXT_PUBLIC_APP_URL ==="
            if grep -q '^BETTER_AUTH_URL=' .env; then
              sed -i 's|^BETTER_AUTH_URL=.*|BETTER_AUTH_URL=https://demo.indigo-fw.dev|' .env
            else
              echo "BETTER_AUTH_URL=https://demo.indigo-fw.dev" >> .env
            fi
            if grep -q '^NEXT_PUBLIC_APP_URL=' .env; then
              sed -i 's|^NEXT_PUBLIC_APP_URL=.*|NEXT_PUBLIC_APP_URL=https://demo.indigo-fw.dev|' .env
            else
              echo "NEXT_PUBLIC_APP_URL=https://demo.indigo-fw.dev" >> .env
            fi
            echo "BETTER_AUTH_URL and NEXT_PUBLIC_APP_URL set to https://demo.indigo-fw.dev"


            echo "=== 4. Table counts before seed ==="
            docker compose -f docker-compose.prod.yml exec -T app bun -e "
            import postgres from 'postgres';
            const sql = postgres(process.env.DATABASE_URL, { max: 1 });
            const r = await sql\`
              SELECT 'cms_posts' AS t, count(*)::int AS n FROM cms_posts
              UNION ALL SELECT 'cms_showcase', count(*)::int FROM cms_showcase
              UNION ALL SELECT 'cms_portfolio', count(*)::int FROM cms_portfolio
            \`;
            console.table(r);
            await sql.end();
            " || echo "(table count check failed — tables may not exist yet)"

            echo "=== 5. One-time bootstrap (seed demo data) ==="
            docker compose -f docker-compose.prod.yml exec -T app bun run init -- -y

            echo "=== 6. Table counts after seed ==="
            docker compose -f docker-compose.prod.yml exec -T app bun -e "
            import postgres from 'postgres';
            const sql = postgres(process.env.DATABASE_URL, { max: 1 });
            const r = await sql\`
              SELECT 'cms_posts' AS t, count(*)::int AS n FROM cms_posts
              UNION ALL SELECT 'cms_showcase', count(*)::int FROM cms_showcase
              UNION ALL SELECT 'cms_portfolio', count(*)::int FROM cms_portfolio
            \`;
            console.table(r);
            await sql.end();
            " || echo "(table count check failed)"

            echo "=== 7. Restart app to pick up new .env values ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps app

            echo "=== 8. Install hourly reset cron ==="
            DOCKER_BIN=$(which docker)
            CRON_LINE="0 * * * * cd /opt/indigo && ${DOCKER_BIN} compose -f docker-compose.prod.yml exec -T app bun run init -- -y --reset >> /var/log/indigo-reset.log 2>&1"

            # Idempotent: only add if not already present
            if crontab -l 2>/dev/null | grep -q 'indigo-reset'; then
              echo "Cron already installed — skipping"
            else
              (crontab -l 2>/dev/null; echo "$CRON_LINE") | crontab -
              echo "Cron installed"
            fi

            echo "=== 9. Create log file ==="
            sudo touch /var/log/indigo-reset.log 2>/dev/null || touch /tmp/indigo-reset.log
            sudo chmod 644 /var/log/indigo-reset.log 2>/dev/null || true

            echo "=== 10. Verify cron ==="
            crontab -l | grep indigo || echo "WARNING: cron line not found"

            echo ""
            echo "✅ Bootstrap complete. Demo site should now show seeded content."
            echo "   Cron will reset data every hour at :00."
