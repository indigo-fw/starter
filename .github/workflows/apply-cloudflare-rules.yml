name: apply-cloudflare-rules

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — print rules without applying (true/false)'
        required: false
        default: 'false'

# Run manually from Actions tab after adding CLOUDFLARE_API_TOKEN secret.
# Required secret: CLOUDFLARE_API_TOKEN
#   Permissions: Zone > Firewall Services: Edit, Zone > Zone Settings: Edit, Zone > Bot Management: Edit
#   Resource:    indigo-fw.dev zone only
# Required variable: CLOUDFLARE_ZONE_ID (repo var) = ba9155a1490a6f177b3fd1fcbc1c45f2

jobs:
  apply:
    name: Apply Cloudflare security rules
    runs-on: ubuntu-latest
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || 'ba9155a1490a6f177b3fd1fcbc1c45f2' }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate token
        run: |
          resp=$(curl -sf "$CF_API/user/tokens/verify" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")
          echo "$resp" | python3 -c "import json,sys; d=json.load(sys.stdin); print('Token status:', d['result']['status']); exit(0 if d['success'] else 1)"

      - name: Show current WAF rules
        run: |
          echo "=== Current WAF custom rules ==="
          curl -sf "$CF_API/zones/$ZONE_ID/rulesets/phases/http_request_firewall_custom/entrypoint" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | \
            python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if not d.get('success'):
            print('No existing ruleset or error:', d.get('errors'))
          else:
            rules = d.get('result',{}).get('rules',[])
            print(f'Found {len(rules)} existing rules')
            for r in rules:
              print(f'  - [{r.get(\"action\")}] {r.get(\"description\",\"(no desc)\")}')
          " || echo "(no existing ruleset)"

          echo ""
          echo "=== Current rate limiting rules ==="
          curl -sf "$CF_API/zones/$ZONE_ID/rulesets/phases/http_ratelimit/entrypoint" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | \
            python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if not d.get('success'):
            print('No existing ruleset or error:', d.get('errors'))
          else:
            rules = d.get('result',{}).get('rules',[])
            print(f'Found {len(rules)} existing rules')
            for r in rules:
              rl = r.get('ratelimit',{})
              print(f'  - {r.get(\"description\",\"(no desc)\")} [{rl.get(\"requests_per_period\")}/{rl.get(\"period\")}s]')
          " || echo "(no existing ruleset)"

      - name: Build WAF custom ruleset payload
        run: |
          python3 - <<'EOF'
          import json

          with open('cloudflare/rules.json') as f:
              rules_config = json.load(f)

          waf = rules_config['waf_custom']
          payload = {
              "description": waf['description'],
              "kind": "zone",
              "name": "Indigo WAF custom rules",
              "phase": "http_request_firewall_custom",
              "rules": [
                  {
                      "action": rule['action'],
                      "expression": rule['expression'],
                      "description": rule['description'],
                      "enabled": True,
                  }
                  for rule in waf['rules']
              ]
          }

          with open('/tmp/waf_payload.json', 'w') as f:
              json.dump(payload, f, indent=2)

          print("WAF payload:")
          print(json.dumps(payload, indent=2))
          EOF

      - name: Build rate limiting ruleset payload
        run: |
          python3 - <<'EOF'
          import json

          with open('cloudflare/rules.json') as f:
              rules_config = json.load(f)

          rl = rules_config['rate_limiting']
          payload = {
              "description": rl['description'],
              "kind": "zone",
              "name": "Indigo rate limiting rules",
              "phase": "http_ratelimit",
              "rules": [
                  {
                      "action": rule['action'],
                      "expression": rule['expression'],
                      "description": rule['description'],
                      "enabled": True,
                      "ratelimit": rule['ratelimit'],
                  }
                  for rule in rl['rules']
              ]
          }

          with open('/tmp/rl_payload.json', 'w') as f:
              json.dump(payload, f, indent=2)

          print("Rate limit payload:")
          print(json.dumps(payload, indent=2))
          EOF

      - name: Apply WAF custom rules
        if: env.DRY_RUN != 'true'
        run: |
          echo "=== Applying WAF custom rules ==="
          resp=$(curl -sf -X PUT "$CF_API/zones/$ZONE_ID/rulesets/phases/http_request_firewall_custom/entrypoint" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/waf_payload.json)

          echo "$resp" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('success'):
            rules = d.get('result',{}).get('rules',[])
            print(f'✅ Applied {len(rules)} WAF custom rules')
            for r in rules: print(f'   [{r[\"action\"]}] {r.get(\"description\",\"\")}')
          else:
            print('❌ Failed:', d.get('errors'))
            exit(1)
          "

      - name: Apply rate limiting rules
        if: env.DRY_RUN != 'true'
        run: |
          echo "=== Applying rate limiting rules ==="
          resp=$(curl -sf -X PUT "$CF_API/zones/$ZONE_ID/rulesets/phases/http_ratelimit/entrypoint" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/rl_payload.json)

          echo "$resp" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('success'):
            rules = d.get('result',{}).get('rules',[])
            print(f'✅ Applied {len(rules)} rate limiting rules')
            for r in rules:
              rl=r.get('ratelimit',{})
              print(f'   {r.get(\"description\",\"\")} [{rl.get(\"requests_per_period\")}/{rl.get(\"period\")}s]')
          else:
            print('❌ Failed:', d.get('errors'))
            exit(1)
          "

      - name: Enable Bot Fight Mode
        if: env.DRY_RUN != 'true'
        run: |
          echo "=== Enabling Bot Fight Mode ==="
          resp=$(curl -sf -X PUT "$CF_API/zones/$ZONE_ID/bot_management" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"fight_mode": true}')

          echo "$resp" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('success'):
            bm = d.get('result',{})
            print(f'✅ Bot Fight Mode: fight_mode={bm.get(\"fight_mode\")}')
          else:
            errs = d.get('errors',[])
            # Bot Fight Mode may require Business/Enterprise plan — warn but don't fail
            print(f'⚠️  Bot Fight Mode: {errs} (may require Business plan — skipping)')
          " || true

      - name: Set Security Level to Medium
        if: env.DRY_RUN != 'true'
        run: |
          echo "=== Setting Security Level ==="
          resp=$(curl -sf -X PATCH "$CF_API/zones/$ZONE_ID/settings/security_level" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"value": "medium"}')

          echo "$resp" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('success'):
            print(f'✅ Security Level: {d[\"result\"][\"value\"]}')
          else:
            print('❌ Failed:', d.get('errors'))
            exit(1)
          "

      - name: Summary
        if: always()
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "✅ Dry run complete — no changes applied"
          else
            echo "✅ Cloudflare security rules applied to zone $ZONE_ID"
            echo ""
            echo "Rules applied:"
            echo "  WAF custom rules    → 3 rules (bot block, empty UA block, JS challenge)"
            echo "  Rate limiting       → 6 rules (login, register, forgot-pw, auth API, upload, forms)"
            echo "  Bot Fight Mode      → enabled (requires Business plan, skipped if not available)"
            echo "  Security Level      → medium"
          fi
