name: setup-backups

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup DB backups on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEMO_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/indigo/backups
            printf '%s\n' \
              '#!/bin/bash' \
              'set -e' \
              'cd /opt/indigo' \
              'BACKUP="/opt/indigo/backups/demo-$(date +%Y%m%d-%H%M%S).sql.gz"' \
              'docker compose -f docker-compose.prod.yml exec -T postgres pg_dump -U indigo indigo | gzip > "$BACKUP"' \
              'find /opt/indigo/backups -name "*.sql.gz" -mtime +30 -delete' \
              'echo "$(date): $BACKUP ($(du -sh "$BACKUP" | cut -f1))"' \
              > /opt/indigo/backup.sh
            chmod +x /opt/indigo/backup.sh
            (crontab -l 2>/dev/null | grep -v backup.sh; echo "0 2 * * * /opt/indigo/backup.sh >> /opt/indigo/backups/backup.log 2>&1") | crontab -
            /opt/indigo/backup.sh
            echo '=== Backups ==='
            ls -lh /opt/indigo/backups/
            echo '=== Crontab ==='
            crontab -l
