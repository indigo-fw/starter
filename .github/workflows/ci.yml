name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install

      - name: Run lint
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

      - name: Run tests
        run: bunx vitest run

      - name: Run production build
        env:
          DATABASE_URL: "postgresql://localhost:5432/test"
          BETTER_AUTH_SECRET: "ci-test-secret-that-is-at-least-32-chars-long"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: bun run build

  # Integration tests against a real Postgres — runs `bun run test:db`, which
  # spins up a temp DB, applies all migrations, exercises the *.db.test.ts
  # suite, then drops the DB. This is what catches migration drift in CI.
  test-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Wait for Postgres to accept connections before steps run.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install

      - name: Run DB integration tests
        env:
          TEST_DB_URL: "postgres://postgres:postgres@localhost:5432/postgres"
        run: bun run test:db

  # Pruned-install guard — proves `init --modules recommended` still yields a
  # working project: paid modules removed, then the pruned tree must typecheck.
  # This is what keeps module removal mechanical (no dangling imports in
  # layouts, sitemap, renderers, hooks — see src/core/CLAUDE.md).
  pruned-install:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install

      - name: Run init with recommended modules (non-interactive)
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/indigo_pruned"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: |
          cp .env.example .env
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql://postgres:postgres@localhost:5432/indigo_pruned|' .env
          bun run init -- -y --no-seed --modules recommended --admin-email ci@example.com

      - name: Typecheck the pruned tree
        run: bun run typecheck
